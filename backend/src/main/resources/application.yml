spring:
  application:
    name: recordkeeping
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:harborpath}
    username: ${POSTGRES_USER:harborpath}
    password: ${POSTGRES_PASSWORD:harborpath}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

harborpath:
  jwt:
    secret: ${JWT_SECRET:harborpath-demo-secret-key-must-be-32b-min!!}
    ttl-seconds: 28800
  cors:
    origins: ${CORS_ORIGINS:http://localhost:4200,http://localhost:4201,http://localhost:4202,http://localhost:4203}
